<SCRIPT LANGUAGE="JavaScript1.1">
// A utility function that returns true if a string contains only
// whitespace characters.
function isblank(s)
{
    for(var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if ((c != ' ') && (c != '\n') && (c != '\t')) return false;
    }
    return true;
}




// This is the function that performs form verification.  It will be invoked
// from the onSubmit() event handler.  The handler should return whatever
// value this function returns.

function verify(f)
{
    var msg;
    var empty_fields = "";
    var errors = "";
	
    // Boucle dans les éléments du formulaire à la recherche de zones
    // text et textarea qui ne sont pas optionnelles.
    // Cherche si des champs sont vides et en fait une liste.
    // Met tous les messages d'erreur dans un unique texte.


    for(var i = 0; i < 1; i++) {
    var e = f.elements[i];

        // Vérifie en premier les champs de text et textarea pour voir s'ils sont vides.
        if ((e.type == "text") || (e.type == "textarea")) {
               if (!e.optional){
	            if ((e.value == null) || (e.value == "") || isblank(e.value)) {
	                empty_fields += "\n          " + e.name;
	                continue;
	
	            }
	        }
        }
    }


    for(var i = 1; i < 2; i++) {
    var d = f.elements[i];
    var e = f.elements[i+1];
        // Vérifie ensuite les champs de type radio pour voir s'ils sont vides.
        if (e.type == "radio"){
          if ((!d.checked) && (!e.checked)) {
// && !(f.elements[3].checked)) {
            empty_fields += "\n          " + e.name;
            continue;
          }
        }
    }


    // S'il y a une erreur, affiche le message
    // et retourne true pour empecher le formulaire d'etre soumis.
    // Sinon, retourne false
    if (!empty_fields) return true;

    msg  = "______________________________________________________\n\n"
    msg += "Votre formulaire n'a pas été soumis car il contient des erreurs.\n";
    msg += "Veuillez les corriger et soumettre votre formulaire à nouveau.\n";
    msg += "______________________________________________________\n\n"



    if (empty_fields) {
        msg += "- Le(s) champs suivant(s) est(sont) vide(s) : \n"
                + empty_fields + "\n";
        msg += "______________________________________________________\n";
        if (errors) msg += "\n";
    }

    alert(msg);
    return false;
}
</SCRIPT>
